services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taichung_car_camping
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U app -d taichung_car_camping
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
